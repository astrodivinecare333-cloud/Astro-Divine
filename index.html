<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Divine - Astrologer Purushottam</title>
    <style>
        /* यह CSS आपकी वेबसाइट को मोबाइल के लिए एकदम सही और सुंदर बनाती है */
        body { 
            background-color: #0a0f1e; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            max-width: 500px; 
            width: 100%;
        }
        /* यह हिस्सा आपकी फोटो को एक प्रीमियम फ्रेम और शैडो देता है */
        .photo-box {
            width: 100%;
            margin-bottom: 25px;
        }
        .photo-box img {
            width: 100%;
            height: auto;
            border-radius: 20px; /* फोटो के कोनों को हल्का गोल करता है */
            box-shadow: 0 15px 40px rgba(0,0,0,0.7); /* फोटो के पीछे एक गहरी छाया (शैडो) डालता है */
            border: 3px solid #d4af37; /* फोटो के चारों तरफ एक सुनहरा (गोल्डन) बॉर्डर */
        }
        /* यह नीचे वाले तीनों सोशल मीडिया बटनों के लिए डिज़ाइन है */
        a { 
            display: block; 
            background: #151c2f; 
            padding: 18px; 
            margin: 18px 0; 
            border-radius: 12px; 
            color: #d4af37; /* बटन के टेक्स्ट का रंग */
            text-decoration: none; 
            font-size: 1.3rem; 
            font-weight: bold;
            border: 1px solid #d4af37; /* बटन का सुनहरा बॉर्डर */
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); /* बटन पर हल्की छाया */
            transition: transform 0.2s; /* क्लिक करने पर हल्का इफ़ेक्ट */
        }
        a:hover {
            transform: scale(1.02); /* माउस ले जाने पर बटन हल्का ज़ूम होगा */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- यहाँ आपकी असली फोटो आएगी -->
        <!-- [जरूरी] src="astro_divine_photo.png" की जगह अपनी फोटो का असली नाम (जैसे ganesh.png) लिखें -->
        <div class="photo-box">
            <img src="astro_divine_photo.png" alt="Astro Divine - Astrologer Purushottam">
        </div>
        
        <!-- संपर्क के लिए बटन - आप लिंक और रंग बदल सकते हैं -->
        <a href="https://wa.me/919145311647" style="color: #25D366;">WhatsApp पर संपर्क करें</a>
        <a href="https://www.instagram.com/astrodivinecare?igsh=Y2ZhamNhZHNzMXQx" style="color: #E1306C;">Instagram पर फॉलो करें</a>
        <a href="https://youtube.com/@astrodivinecare?si=FTx0XaVWMrYGwuAD" style="color: #FF0000;">YouTube चैनल देखें</a>
    </div>
</body>
</html>
