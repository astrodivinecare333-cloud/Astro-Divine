<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>कुंडली प्रोफाइल - Astro Divine</title>
    <style>
        body { background-color: #ffffff; color: #333; font-family: sans-serif; padding: 0; margin: 0; }
        .header { background: #f9a825; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .container { padding: 20px; max-width: 500px; margin: auto; }
        
        /* लिंग चयन */
        .gender-select { display: flex; justify-content: center; gap: 40px; margin: 20px 0; }
        
        /* बड़े इनपुट फील्ड्स */
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input { 
            width: 100%; padding: 15px; margin-bottom: 20px; 
            border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; 
        }
        .row { display: flex; gap: 10px; }
        .row input { width: 50%; }
        
        button { 
            width: 100%; background: #5e35b1; color: white; padding: 18px; 
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">नया प्रोफाइल जोड़ें</div>

    <div class="container">
        <!-- भाषा का विकल्प (यह बटन हम बाद में और बढ़ाएंगे) -->
        <div style="text-align: right; margin-bottom: 10px;">
            <small>भाषा: हिंदी | English | मराठी</small>
        </div>

        <form action="#">
            <div class="gender-select">
                <label><input type="radio" name="gender" value="male"> पुरुष</label>
                <label><input type="radio" name="gender" value="female"> स्त्री</label>
            </div>

            <label>नाम</label>
            <input type="text" placeholder="नाम लिखें">

            <div class="row">
                <div>
                    <label>जन्म तिथि</label>
                    <input type="date">
                </div>
                <div>
                    <label>जन्म समय</label>
                    <input type="time">
                </div>
            </div>

            <label>जन्म स्थान</label>
            <input type="text" placeholder="शहर का नाम लिखें">

            <button type="submit">पुष्ट करें और आगे बढ़ें</button>
        </form>
    </div>

</body>
</html>
