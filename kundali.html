
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कुंडली विश्लेषण - Astro Divine</title>
    <style>
        body { 
            background: linear-gradient(135deg, #001f3f 0%, #000b1a 100%); 
            color: #d4af37; 
            text-align: center; 
            padding: 15px; 
            font-family: 'Georgia', serif;
            min-height: 100vh;
        }
        .royal-box { 
            background: rgba(0, 31, 63, 0.8); 
            border: 3px solid #d4af37; 
            border-radius: 20px; 
            padding: 20px; 
            margin: 15px auto; 
            max-width: 450px; 
            text-align: left; 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        h2 { color: #d4af37; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; }
        label { display: block; margin-top: 12px; color: #d4af37; font-weight: bold; font-size: 0.95rem; }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border-radius: 8px; 
            border: 1px solid #d4af37; 
            background: #000b1a; 
            color: #fff; 
            box-sizing: border-box; 
            font-size: 1rem;
        }
        button { 
            width: 100%; 
            background: #d4af37; 
            color: #001f3f; 
            padding: 12px; 
            margin-top: 20px; 
            border: none; 
            border-radius: 50px; 
            font-size: 1rem; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover { background: #f3c653; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #d4af37; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="royal-box">
        <h2>कुंडली विश्लेषण फॉर्म</h2>
        <form action="https://wa.me/919145311647" method="get" target="_blank">
            <label>पूरा नाम:</label>
            <input type="text" name="text" placeholder="अपना पूरा नाम लिखें" required>

            <label>जन्म तिथि (DOB):</label>
            <input type="date" name="text" required>

            <label>जन्म समय (Time):</label>
            <input type="time" name="text" required>

            <label>जन्म स्थान (Place):</label>
            <input type="text" name="text" placeholder="गाँव या शहर का नाम" required>

            <label>मुख्य सवाल या समस्या:</label>
            <textarea name="text" rows="3" placeholder="आप क्या जानना चाहते हैं?"></textarea>

            <button type="submit">WhatsApp पर विवरण भेजें</button>
        </form>
        <a href="index.html" class="back-link">← वापस होम पेज पर जाएं</a>
    </div>
</body>
</html>
