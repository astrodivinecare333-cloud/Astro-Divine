<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>कुंडली विश्लेषण - Astro Divine</title>
    <style>
        body { background: linear-gradient(135deg, #001f3f 0%, #000b1a 100%); color: #d4af37; text-align: center; padding: 20px; font-family: 'Georgia', serif; }
        .royal-box { background: rgba(0, 31, 63, 0.85); border: 3px solid #d4af37; border-radius: 20px; padding: 20px; max-width: 450px; margin: auto; }
        h2 { color: #d4af37; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #d4af37; background: #000b1a; color: #d4af37; }
        button { background: #d4af37; color: #001f3f; padding: 12px 25px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .back-link { display: block; margin-top: 20px; color: #d4af37; text-decoration: none; }
    </style>
</head>
<body>
    <div class="royal-box">
        <h2>📜 कुंडली विश्लेषण</h2>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <input type="text" name="name" placeholder="अपना नाम लिखें" required>
            <input type="date" name="dob" required>
            <input type="time" name="tob" required>
            <input type="text" name="pob" placeholder="जन्म स्थान" required>
            <textarea name="message" placeholder="आपकी समस्या/प्रश्न" rows="4"></textarea>
            <button type="submit">सबमिट करें</button>
        </form>
        <a href="index.html" class="back-link">← वापस होम पेज</a>
    </div>
</body>
</html>
