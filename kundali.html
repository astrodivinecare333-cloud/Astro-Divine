<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कुंडली विश्लेषण - Astro Divine</title>
    <style>
        /* ब्रांडिंग और थीम */
        body { background: linear-gradient(135deg, #001f3f 0%, #000b1a 100%); color: #d4af37; font-family: 'Georgia', serif; margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 450px; margin: auto; background: rgba(0, 31, 63, 0.9); border: 2px solid #d4af37; border-radius: 20px; padding: 25px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        h2 { text-align: center; color: #f3c653; margin-bottom: 20px; }
        
        /* फॉर्म डिजाइन */
        label { display: block; margin: 15px 0 5px; font-size: 0.9rem; color: #f3c653; }
        input[type="text"], input[type="date"], input[type="time"] { width: 100%; padding: 12px; border: 1px solid #d4af37; border-radius: 8px; background: #000b1a; color: #fff; font-size: 1rem; box-sizing: border-box; }
        
        .radio-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #fff; }
        
        button { width: 100%; background: #d4af37; color: #000b1a; padding: 15px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        button:hover { background: #f3c653; }
        
        /* गूगल ट्रांसलेट */
        .goog-te-combo { background: #000b1a; color: #d4af37; border: 1px solid #d4af37; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- भाषा विकल्प -->
    <div id="google_translate_element" style="text-align: center; margin-bottom: 15px;"></div>
    
    <h2>📜 नया प्रोफाइल जोड़ें</h2>

    <div class="radio-group">
        <label><input type="radio" name="gender" value="male" checked> ♂️ पुरुष</label>
        <label><input type="radio" name="gender" value="female"> ♀️ स्त्री</label>
    </div>

    <label>👤 नाम</label>
    <input type="text" placeholder="अपना नाम लिखें">

    <label>📅 जन्म तिथि</label>
    <input type="date">

    <label>⏰ जन्म समय</label>
    <input type="time">

    <label>📍 जन्म स्थान</label>
    <input type="text" placeholder="शहर का नाम लिखें">

    <button type="button">✨ पुष्ट करें और आगे बढ़ें</button>
</div>

<!-- ट्रांसलेट स्क्रिप्ट -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'hi', includedLanguages: 'hi,mr,en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
