<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कुंडली बनाएं - Astro Divine</title>
    <style>
        body { 
            background: linear-gradient(135deg, #001f3f 0%, #000b1a 100%); 
            color: #d4af37; 
            font-family: 'Georgia', serif; 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .container { 
            max-width: 480px; 
            width: 100%; 
            background: rgba(0, 31, 63, 0.9); 
            border: 2px solid #d4af37; 
            border-radius: 15px; 
            padding: 20px; 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); 
            box-sizing: border-box; 
        }
        .header { 
            background: #d4af37; 
            color: #000b1a; 
            padding: 12px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.1rem; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #f3c653; 
            font-size: 0.95rem; 
            font-weight: bold; 
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            background: #000b1a; 
            border: 1px solid #d4af37; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 1rem; 
            box-sizing: border-box; 
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: #f3c653; 
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5); 
        }
        .btn { 
            display: block; 
            width: 100%; 
            background: #d4af37; 
            color: #000b1a; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.05rem; 
            font-weight: bold; 
            text-align: center; 
            cursor: pointer; 
            margin-top: 20px; 
            transition: 0.3s; 
        }
        .btn:hover { 
            background: #f3c653; 
        }
        .btn-reset { 
            background: transparent; 
            color: #ff6b6b; 
            border: 1px solid #ff6b6b; 
            margin-top: 10px; 
        }
        .btn-reset:hover { 
            background: rgba(255, 107, 107, 0.1); 
            color: #ff5252; 
        }
        .goog-te-combo { 
            background: #000b1a; 
            color: #d4af37; 
            border: 1px solid #d4af37; 
            padding: 5px; 
            border-radius: 5px; 
            margin-bottom: 15px; 
            width: 100%; 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- भाषा अनुवाद विकल्प -->
    <div id="google_translate_element"></div>

    <div class="header">✨ Astro Divine - जन्म विवरण दर्ज करें ✨</div>

    <form id="kundaliForm" onsubmit="generateKundali(event)">
        <div class="form-group">
            <label for="name">पूरा नाम (Full Name):</label>
            <input type="text" id="name" required placeholder="अपना नाम लिखें">
        </div>

        <div class="form-group">
            <label for="dob">जन्म तिथि (Date of Birth):</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label for="tob">जन्म समय (Time of Birth):</label>
            <input type="time" id="tob" required>
        </div>

        <div class="form-group">
            <label for="pob">जन्म स्थान (Place of Birth):</label>
            <input type="text" id="pob" required placeholder="शहर का नाम (जैसे: Shirdi, Mumbai)">
        </div>

        <button type="submit" class="btn">कुंडली देखें & विश्लेषण प्राप्त करें</button>
        <button type="button" class="btn btn-reset" onclick="clearKundaliData()">पुराना डेटा साफ़ करें (Reset)</button>
    </form>
</div>

<script>
    // यदि पहले से कोई डेटा सेव है, तो फॉर्म में ऑटोमैटिक भर दें
    window.onload = function() {
        if(localStorage.getItem('userName')) {
            document.getElementById('name').value = localStorage.getItem('userName');
        }
        if(localStorage.getItem('userDob')) {
            document.getElementById('dob').value = localStorage.getItem('userDob');
        }
        if(localStorage.getItem('userTob')) {
            document.getElementById('tob').value = localStorage.getItem('userTob');
        }
        if(localStorage.getItem('userPob')) {
            document.getElementById('pob').value = localStorage.getItem('userPob');
        }
    }

    function generateKundali(event) {
        event.preventDefault();
        
        // यूज़र का डेटा कलेक्ट करें
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const tob = document.getElementById('tob').value;
        const pob = document.getElementById('pob').value;

        // डेटा को लोकल स्टोरेज में सेव करें
        localStorage.setItem('userName', name);
        localStorage.setItem('userDob', dob);
        localStorage.setItem('userTob', tob);
        localStorage.setItem('userPob', pob);

        // result.html पर रीडायरेक्ट करें
        window.location.href = 'result.html';
    }

    // लोकल स्टोरेज और फॉर्म का डेटा डिलीट करने का फंक्शन
    function clearKundaliData() {
        localStorage.removeItem('userName');
        localStorage.removeItem('userDob');
        localStorage.removeItem('userTob');
        localStorage.removeItem('userPob');
        document.getElementById('kundaliForm').reset();
        alert('सहेजा गया पुराना डेटा सफलतापूर्वक साफ़ कर दिया गया है!');
    }
</script>

<!-- गूगल ट्रांसलेट स्क्रिप्ट -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'hi', includedLanguages: 'hi,mr,en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
