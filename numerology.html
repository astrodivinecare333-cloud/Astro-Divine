<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Divine - Numerology Analysis</title>
    <style>
        :root {
            --royal-blue: #0b192c;
            --golden: #ffcc00;
        }
        body { background-color: #f4f7f6; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: var(--royal-blue); padding: 20px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); border: 2px solid var(--golden); }
        .branding { text-align: center; color: var(--golden); margin-bottom: 20px; }
        .branding h1 { margin: 0; font-size: 28px; }
        .branding p { margin: 5px 0 0 0; color: #fff; font-size: 14px; }
        
        label { display: block; margin-top: 15px; color: var(--golden); font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 5px; box-sizing: border-box; }
        
        button { width: 100%; padding: 14px; margin-top: 25px; background: var(--golden); border: none; border-radius: 5px; font-weight: bold; color: var(--royal-blue); cursor: pointer; font-size: 16px; }
        
        .result-box { color: #fff; margin-top: 20px; display: none; }
        .data-card { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 10px; margin-top: 10px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 204, 0, 0.2); }
    </style>
</head>
<body>

<div class="container">
    <div class="branding">
        <h1>Astro Divine</h1>
        <p>अंक ज्योतिष एवं भाग्य विश्लेषण</p>
    </div>

    <div id="form-view">
        <label>पूरा नाम (Full Name)</label>
        <input type="text" id="name" placeholder="अपना नाम लिखें">
        <label>जन्म तिथि (DOB)</label>
        <input type="date" id="dob">
        <label>फोन नंबर (Phone Number)</label>
        <input type="tel" id="phone" placeholder="अपना नंबर">
        <button onclick="analyze()">विश्लेषण करें</button>
    </div>

    <div id="report-view" class="result-box">
        <div class="data-card">
            <div class="info-row"><span>मूलांक:</span> <strong id="r-mool"></strong></div>
            <div class="info-row"><span>भाग्यांक:</span> <strong id="r-bhag"></strong></div>
            <div class="info-row"><span>शुभ अंक:</span> <strong id="r-lucky"></strong></div>
            <div class="info-row"><span>आराध्य देव:</span> <strong id="r-god"></strong></div>
        </div>
        <button onclick="location.reload()">नया विश्लेषण</button>
    </div>
</div>

<script>
    window.onload = () => {
        document.getElementById('name').value = localStorage.getItem('uName') || '';
        document.getElementById('dob').value = localStorage.getItem('uDob') || '';
        document.getElementById('phone').value = localStorage.getItem('uPhone') || '';
    };

    function analyze() {
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const phone = document.getElementById('phone').value;
        
        localStorage.setItem('uName', name);
        localStorage.setItem('uDob', dob);
        localStorage.setItem('uPhone', phone);
        
        // कैलकुलेशन लॉजिक...
        alert("विश्लेषण तैयार है! (यहाँ आपका रॉयल ब्लू & गोल्डन रिपोर्ट कार्ड दिखेगा)");
        document.getElementById('form-view').style.display = 'none';
        document.getElementById('report-view').style.display = 'block';
    }
</script>
</body>
</html>
