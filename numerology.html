<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Astro Divine - Premium Numerology Analysis</title>
    <style>
        body { background-color: #f4f7f6; font-family: sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .top-bar { background: #ffbc00; padding: 15px; color: #fff; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .calc-grid { display: flex; gap: 5px; padding: 10px; }
        .calc-box { flex: 1; text-align: center; padding: 10px; border-radius: 5px; font-size: 12px; }
        .info-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .info-table td { border: 1px solid #ddd; padding: 10px; font-size: 13px; }
        .input-form { padding: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ffbc00; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="form-view" class="input-form">
        <h2>Astro Divine</h2>
        <input type="text" id="name" placeholder="पूरा नाम">
        <input type="date" id="dob">
        <input type="tel" id="phone" placeholder="फोन नंबर">
        <button onclick="analyze()">विश्लेषण करें</button>
    </div>

    <div id="report-view" style="display:none;">
        <div class="top-bar"><span id="res-name">नाम</span></div>
        <div class="calc-grid">
            <div class="calc-box" style="background:#fff3cd;"><div>भाग्यांक</div><h2 id="r-bhag"></h2></div>
            <div class="calc-box" style="background:#d1e7dd;"><div>मूलांक</div><h2 id="r-mool"></h2></div>
            <div class="calc-box" style="background:#f8d7da;"><div>नाम अंक</div><h2 id="r-naam"></h2></div>
        </div>
        <table class="info-table">
            <tr><td>फोन टोटल</td><td id="t-phone"></td></tr>
            <tr><td>फोन मैचिंग</td><td id="t-match"></td></tr>
            <tr><td>शत्रु अंक</td><td id="t-enemy" style="color:red;"></td></tr>
            <tr><td>अनुकूल अंक</td><td id="t-friendly" style="color:green;"></td></tr>
            <tr><td>अनुकूल देवता</td><td id="t-god"></td></tr>
            <tr><td>अनुकूल रत्न</td><td id="t-gem"></td></tr>
            <tr><td>अनुकूल मंत्र</td><td id="t-mantra" style="font-size:11px;"></td></tr>
        </table>
        <div style="padding:15px;"><button onclick="location.reload()">नया विश्लेषण</button></div>
    </div>
</div>

<script>
    function reduce(n) { while(n > 9) n = n.toString().split('').reduce((a,b)=>+a + +b, 0); return n; }

    function analyze() {
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const phone = document.getElementById('phone').value;

        // कैलकुलेशन
        let mool = reduce(new Date(dob).getDate());
        let bhag = reduce(dob.replace(/-/g, '').split('').reduce((a,b)=>+a + +b, 0));
        let pTotal = reduce(phone.split('').reduce((a,b)=>+a + +b, 0));
        
        // फोन मैचिंग लॉजिक
        let match = (pTotal === mool || pTotal === bhag) ? "अति उत्तम (Highly Compatible)" : "सामान्य (Average)";

        // फलादेश डेटाबेस (उदाहरण)
        const data = {
            1: {enemy: "6, 8", friendly: "1, 2, 4, 7", god: "सूर्य", gem: "रूबी", mantra: "|| ॐ सूर्याय नम: ||"},
            2: {enemy: "8, 9", friendly: "1, 2, 7", god: "शिव", gem: "मोती", mantra: "|| ॐ नम: शिवाय ||"},
            3: {enemy: "4, 5, 8", friendly: "3, 6, 9", god: "विष्णु", gem: "पुखराज", mantra: "|| ॐ गुरवे नम: ||"}
            // ... बाकी अंक 4-9 के लिए भी ऐसे ही डेटा जोड़ सकते हैं
        };

        const d = data[mool] || {enemy: "नियत नहीं", friendly: "नियत नहीं", god: "ध्यान करें", gem: "परामर्श लें", mantra: "ॐ नम: शिवाय"};

        // डेटा अपडेट
        document.getElementById('r-mool').innerText = mool;
        document.getElementById('r-bhag').innerText = bhag;
        document.getElementById('t-phone').innerText = pTotal;
        document.getElementById('t-match').innerText = match;
        document.getElementById('t-enemy').innerText = d.enemy;
        document.getElementById('t-friendly').innerText = d.friendly;
        document.getElementById('t-god').innerText = d.god;
        document.getElementById('t-gem').innerText = d.gem;
        document.getElementById('t-mantra').innerText = d.mantra;

        document.getElementById('form-view').style.display = 'none';
        document.getElementById('report-view').style.display = 'block';
    }
</script>
</body>
</html>
