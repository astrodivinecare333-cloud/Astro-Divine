        .horoscope-view { padding: 15px; display: none; }
        .date-badge { text-align: center; font-size: 13px; color: #ffeb99; margin-bottom: 15px; border-bottom: 1px solid rgba(255,204,0,0.2); padding-bottom: 8px; }

        .table td:first-child { color: #ffeb99; width: 35%; font-weight: bold; }
        .table td:last-child { color: #fff; }

    function showHoroscope() {
        let zodiacKey = document.getElementById('zodiac-select').value;
        let lang = document.getElementById('main-lang').value;
        
        let data = horoscopeData[zodiacKey][lang];

        // आज की तारीख सेट करें
        let options = { year: 'numeric', month: 'long', day: 'numeric' };
        let todayStr = new Date().toLocaleDateString(lang === 'hi' ? 'hi-IN' : (lang === 'mr' ? 'mr-IN' : 'en-US'), options);
        
        document.getElementById('current-date').innerText = (lang === 'hi' ? "तारीख: " : (lang === 'mr' ? "दिनांक: " : "Date: ")) + todayStr;

        // डेटा भरें
        document.getElementById('r-lucky').innerText = data.luckyNum;
        document.getElementById('r-color').innerText = data.luckyCol;
        document.getElementById('desc-general').innerText = data.general;
        document.getElementById('desc-health').innerText = data.health;
        document.getElementById('desc-career').innerText = data.career;
        document.getElementById('desc-love').innerText = data.love;
        document.getElementById('desc-remedy').innerText = data.remedy;

        // व्यू बदलें
        document.getElementById('selection-view').style.display = 'none';
        document.getElementById('horoscope-view').style.display = 'block';
    }
